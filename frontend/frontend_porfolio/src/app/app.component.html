<div id="top" class="min-h-screen bg-primary font-sans text-surface">
  <app-navbar [profile]="profile"></app-navbar>
  <app-home [profile]="profile"></app-home>

  <main>
    <p *ngIf="apiError" class="mx-auto my-8 max-w-6xl rounded-2xl border border-rose-200 bg-rose-50 px-5 py-4 text-sm text-rose-800" role="alert">
      {{ apiError }}
    </p>

    <app-education [experiences]="profile.experiences"></app-education>
    <div class="mx-auto max-w-6xl px-5 py-20 sm:px-8 lg:px-10"><app-projects [projects]="profile.projects"></app-projects></div>
    <skills-section [skills]="profile.skills"></skills-section>
  </main>
</div>
