<div id="top" class="min-h-screen bg-primary font-sans text-surface">
  <app-navbar [profile]="profile"></app-navbar>
  <app-home [profile]="profile"></app-home>

  <main class="w-full mx-auto max-w-7xl px-6 sm:px-10 lg:px-14">
    <p *ngIf="apiError" class="mx-auto my-8 w-full rounded-2xl border border-accent/30 bg-accent/10 px-5 py-4 text-sm text-surface" role="alert">
      {{ apiError }}
    </p>

    <app-education [educations]="profile.educations || []" [experiences]="profile.experiences"></app-education>
    <app-projects [projects]="profile.projects"></app-projects>
    <skills-section [skills]="profile.skills"></skills-section>
    <app-contact></app-contact>
  </main>

  <app-footer [profile]="profile"></app-footer>
</div>
