<section
  class="relative min-h-[90vh] w-full overflow-hidden bg-primary pt-24 pb-12 lg:pt-0 lg:pb-0 flex items-center"
  aria-label="Hero"
>
  <div
    class="relative z-20 grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-12 w-full max-w-7xl mx-auto px-6 sm:px-10 lg:px-14 items-center"
  >

    <!-- LEFT SIDE -->
    <div
      class="flex flex-col justify-center relative z-30 pt-10 lg:pt-0"
    >
      <!-- Name -->
      <h1
        class="text-5xl sm:text-7xl lg:text-[8rem] font-black leading-[0.85] text-surface tracking-tighter uppercase break-words drop-shadow-lg"
      >
        {{ profile.full_name || profile.name || 'Your Name' }}
      </h1>

      <!-- Bio -->
      <div class="mt-8 lg:mt-10">
        <p
          class="text-base sm:text-lg lg:text-2xl text-surface leading-[1.8] max-w-2xl font-medium"
        >
          I'm {{ profile.bio || 'a Software Engineer' }}
        </p>
      </div>
    </div>


    <!-- RIGHT SIDE -->
    <div
      class="relative flex justify-center items-center w-full mt-8 lg:mt-0"
    >
      <div
        class="relative z-10 w-full max-w-[280px] sm:max-w-[380px] lg:max-w-[480px]
               aspect-[4/5]
               overflow-hidden
               rounded-[2rem] sm:rounded-[3rem] lg:rounded-[4rem]
               shadow-[0_25px_80px_-15px_rgba(0,0,0,0.6)]
               ring-1 ring-white/10
               bg-surface/5
               flex items-center justify-center"
      >

        <!-- Profile Image -->
        <img
          *ngIf="profile.image"
          [src]="profile.image"
          [alt]="(profile.full_name || profile.name || 'Profile') + ' portrait'"
          loading="eager"
          decoding="async"
          fetchpriority="high"
          class="h-full w-full object-contain object-center select-none"
        />

        <!-- No image fallback -->
        <div
          *ngIf="!profile.image"
          class="absolute inset-0 flex items-center justify-center bg-primary-800/50"
        >
          <span
            class="text-7xl sm:text-8xl lg:text-9xl font-black text-surface/20"
          >
            {{ initials }}
          </span>
        </div>

      </div>
    </div>

  </div>
</section>
