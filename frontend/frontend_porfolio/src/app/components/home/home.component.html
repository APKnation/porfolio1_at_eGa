<section class="relative h-screen min-h-[620px] w-full overflow-hidden bg-primary-950" aria-label="Hero">

  <!-- ═══════════════════════════════════════════════
       70% PRIMARY — fills the entire background
       ═══════════════════════════════════════════════ -->

  <!-- Subtle grain texture overlay (stays primary) -->
  <div class="pointer-events-none absolute inset-0 opacity-[0.04]"
       style="background-image: url(&quot;data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E&quot;); background-size: 180px;">
  </div>

  <!-- ═══════════════════════════════════════════════
       LAYER 1 — BIG NAME (top, full-width)
       20% SURFACE — dominant text color
       ═══════════════════════════════════════════════ -->
  <div class="absolute top-[8%] left-0 right-0 px-6 sm:px-10 lg:px-14 z-20">
    <h1 class="font-black uppercase leading-[0.86] text-surface tracking-[-0.04em] whitespace-nowrap"
        style="font-size: clamp(3.2rem, 11.5vw, 9.5rem);">
      {{ profile.full_name || profile.name || 'Your Name' }}
    </h1>
  </div>

  <!-- ═══════════════════════════════════════════════
       LAYER 2 — TITLE SPLIT ROW (left word / right word)
       20% SURFACE at reduced opacity so photo reads through
       ═══════════════════════════════════════════════ -->
  <div class="absolute left-0 right-0 top-[32%] z-20 flex items-center justify-between px-6 sm:px-10 lg:px-14 pointer-events-none">
    <span class="font-black uppercase tracking-[0.12em] text-surface/55"
          style="font-size: clamp(1.1rem, 4vw, 3.4rem);">
      {{ titleLeft }}
    </span>
    <span class="font-black uppercase tracking-[0.12em] text-surface/55"
          style="font-size: clamp(1.1rem, 4vw, 3.4rem);">
      {{ titleRight }}
    </span>
  </div>

  <!-- ═══════════════════════════════════════════════
       LAYER 3 — CENTERED PROFILE PHOTO
       Photo sits in the middle at z-10, between text layers
       Gradient foot fades into primary background
       ═══════════════════════════════════════════════ -->
  <div class="absolute inset-x-0 bottom-0 top-[22%] z-10 flex justify-center items-end">

    <!-- Image present -->
    <ng-container *ngIf="profile.image; else photoPlaceholder">
      <div class="relative h-full flex items-end justify-center">
        <img
          [src]="profile.image"
          [alt]="(profile.full_name || profile.name || 'Profile') + ' portrait'"
          class="h-[95%] w-auto max-w-[360px] sm:max-w-[440px] object-cover object-top select-none"
          style="mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
                 -webkit-mask-image: linear-gradient(to bottom, black 70%, transparent 100%);"
        >
        <!-- Bottom fade into bg -->
        <div class="absolute bottom-0 inset-x-0 h-40 bg-gradient-to-t from-primary-950 to-transparent pointer-events-none"></div>
      </div>
    </ng-container>

    <!-- No image — initials placeholder -->
    <ng-template #photoPlaceholder>
      <div class="relative flex h-[80%] w-[280px] sm:w-[340px] items-end justify-center overflow-hidden">
        <div class="h-full w-full flex items-center justify-center bg-primary-800 text-surface/10"
             style="font-size: clamp(6rem, 20vw, 14rem); font-weight: 900; line-height: 1;">
          {{ initials }}
        </div>
        <!-- Bottom fade -->
        <div class="absolute bottom-0 inset-x-0 h-32 bg-gradient-to-t from-primary-950 to-transparent"></div>
      </div>
    </ng-template>
  </div>

  <!-- ═══════════════════════════════════════════════
       LAYER 4 — BOTTOM-LEFT INFO BLOCK
       20% SURFACE text + 10% ACCENT badge & button
       ═══════════════════════════════════════════════ -->
  <div class="absolute bottom-8 left-6 z-30 sm:bottom-12 sm:left-10 lg:bottom-14 lg:left-14 max-w-[300px]">

    <!-- 10% ACCENT — availability badge pill -->
    <div class="inline-flex items-center gap-2 rounded-full border border-surface/20 bg-primary-800/70 px-4 py-1.5 backdrop-blur-sm">
      <span class="h-2 w-2 rounded-full bg-accent animate-pulse flex-shrink-0"></span>
      <span class="text-[11px] font-semibold tracking-wide text-surface/75">Open for opportunities</span>
    </div>

    <!-- 20% SURFACE — bio text -->
    <p class="mt-4 text-sm leading-[1.7] text-surface/60 max-w-[250px]">
      {{ profile.bio || 'Hey there! I\'m a designer &amp; developer working in the global marketplace.' }}
    </p>

    <!-- 10% ACCENT — CTA button (outline style keeps accent minimal) -->
    <a *ngIf="profile.email" [href]="'mailto:' + profile.email"
       class="mt-5 inline-flex items-center gap-2 rounded-full border border-accent/60 bg-transparent px-5 py-2.5 text-sm font-semibold text-surface/90 transition-all duration-200 hover:bg-accent hover:text-primary-900 hover:border-accent">
      Schedule a Call
    </a>
    <!-- Fallback button if no email -->
    <a *ngIf="!profile.email" href="#education"
       class="mt-5 inline-flex items-center gap-2 rounded-full border border-accent/60 bg-transparent px-5 py-2.5 text-sm font-semibold text-surface/90 transition-all duration-200 hover:bg-accent hover:text-primary-900 hover:border-accent">
      View Work
    </a>
  </div>

  <!-- ═══════════════════════════════════════════════
       LAYER 5 — Social links (bottom-right, z-30)
       20% SURFACE, 10% ACCENT on hover
       ═══════════════════════════════════════════════ -->
  <div class="absolute bottom-8 right-6 z-30 flex flex-col gap-2 sm:bottom-12 sm:right-10 lg:bottom-14 lg:right-14">
    <a *ngIf="profile.linkedin" [href]="profile.linkedin" target="_blank" rel="noopener noreferrer"
       class="grid h-9 w-9 place-items-center rounded-full border border-surface/20 text-[11px] font-black text-surface/50 transition-all hover:border-accent hover:text-accent hover:bg-accent/10"
       aria-label="LinkedIn">in</a>
    <a *ngIf="profile.github" [href]="profile.github" target="_blank" rel="noopener noreferrer"
       class="grid h-9 w-9 place-items-center rounded-full border border-surface/20 text-[11px] font-black text-surface/50 transition-all hover:border-accent hover:text-accent hover:bg-accent/10"
       aria-label="GitHub">gh</a>
    <a *ngIf="profile.website" [href]="profile.website" target="_blank" rel="noopener noreferrer"
       class="grid h-9 w-9 place-items-center rounded-full border border-surface/20 text-sm font-black text-surface/50 transition-all hover:border-accent hover:text-accent hover:bg-accent/10"
       aria-label="Website">↗</a>
  </div>

</section>
