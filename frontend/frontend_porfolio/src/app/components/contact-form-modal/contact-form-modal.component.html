<div
  *ngIf="isOpen"
  class="fixed inset-0 z-50 flex items-center justify-center bg-primary/80 px-4 py-6 backdrop-blur-md"
>
  <!-- Modal -->
  <div class="relative w-full max-w-lg overflow-hidden rounded-3xl border border-primary/50 bg-primary shadow-[0_25px_80px_-15px_rgba(124,58,237,0.35)]">

    <!-- Decorative gradient -->
    <div class="absolute inset-x-0 top-0 h-32 bg-gradient-to-br from-accent via-accent to-accent opacity-95"></div>

    <!-- Close button -->
    <button
      type="button"
      (click)="isOpen = false"
      class="absolute right-5 top-5 z-10 flex h-10 w-10 items-center justify-center rounded-full bg-surface/20 text-surface backdrop-blur-md transition duration-300 hover:bg-surface/30 hover:rotate-90 focus:outline-none focus:ring-2 focus:ring-surface/50"
      aria-label="Close"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="h-5 w-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
      </svg>
    </button>

    <!-- Header -->
    <div class="relative px-7 pb-8 pt-7 text-surface">
      <!-- Avatar -->
      <div class="mb-5 flex h-16 w-16 items-center justify-center rounded-2xl bg-surface/20 shadow-lg ring-1 ring-surface/30 backdrop-blur-md">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-8 w-8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.5 20.25a8.25 8.25 0 0 1 15 0" />
        </svg>
      </div>
      <h3 class="text-2xl font-bold tracking-tight">Contact information</h3>
      <p class="mt-2 max-w-md text-sm leading-6 text-surface/75">Contact details are securely managed by a Django superuser.</p>
    </div>

    <!-- Contact information -->
    <div class="space-y-3 bg-primary/80 px-7 py-7">

      <!-- Email -->
      <div
        *ngIf="profile.email"
        class="group flex items-center gap-4 rounded-2xl border border-primary/50 bg-primary p-4 shadow-sm transition-all duration-300 hover:-translate-y-0.5 hover:border-accent/40 hover:shadow-md"
      >
        <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-accent/10 text-accent transition group-hover:bg-accent group-hover:text-surface">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-5 w-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5A2.25 2.25 0 0 1 19.5 19.5h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0-8.69 5.36a1.875 1.875 0 0 1-2.12 0L2.25 6.75" />
          </svg>
        </div>
        <div class="min-w-0">
          <p class="text-xs font-semibold uppercase tracking-wider text-surface">Email</p>
          <p class="mt-1 truncate font-medium text-surface">{{ profile.email }}</p>
        </div>
      </div>

      <!-- Phone -->
      <div
        *ngIf="profile.phone"
        class="group flex items-center gap-4 rounded-2xl border border-primary/50 bg-primary p-4 shadow-sm transition-all duration-300 hover:-translate-y-0.5 hover:border-accent/40 hover:shadow-md"
      >
        <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-accent/10 text-accent transition group-hover:bg-accent group-hover:text-surface">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-5 w-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0-1.243 1.007-2.25 2.25-2.25h2.386c.97 0 1.83.624 2.133 1.545l1.09 3.27a2.25 2.25 0 0 1-.49 2.285l-1.19 1.19a16.5 16.5 0 0 0 4.8 4.8l1.19-1.19a2.25 2.25 0 0 1 2.285-.49l3.27 1.09a2.25 2.25 0 0 1 1.545 2.133V21.75a2.25 2.25 0 0 1-2.25 2.25h-.75C10.348 24 0 13.652 0 1.75V1a2.25 2.25 0 0 1 2.25-2.25" />
          </svg>
        </div>
        <div class="min-w-0">
          <p class="text-xs font-semibold uppercase tracking-wider text-surface">Phone</p>
          <p class="mt-1 font-medium text-surface">{{ profile.phone }}</p>
        </div>
      </div>

      <!-- Location -->
      <div
        *ngIf="profile.location"
        class="group flex items-center gap-4 rounded-2xl border border-primary/50 bg-primary p-4 shadow-sm transition-all duration-300 hover:-translate-y-0.5 hover:border-accent/40 hover:shadow-md"
      >
        <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-accent/10 text-accent transition group-hover:bg-accent group-hover:text-surface">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-5 w-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 10.5-7.5 10.5S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
          </svg>
        </div>
        <div class="min-w-0">
          <p class="text-xs font-semibold uppercase tracking-wider text-surface">Location</p>
          <p class="mt-1 font-medium text-surface">{{ profile.location }}</p>
        </div>
      </div>

      <!-- Empty state -->
      <div
        *ngIf="!profile.email && !profile.phone && !profile.location"
        class="rounded-2xl border border-dashed border-primary bg-primary p-8 text-center"
      >
        <p class="text-sm font-medium text-surface">No contact information available.</p>
        <p class="mt-1 text-xs text-surface">Contact details have not been added yet.</p>
      </div>
    </div>

    <!-- Footer -->
    <div class="flex items-center justify-between border-t border-primary/50 bg-primary/60 px-7 py-5">
      <p class="text-xs text-surface">Managed securely</p>
      <button
        type="button"
        (click)="isOpen = false"
        class="rounded-xl bg-accent px-5 py-2.5 text-sm font-semibold text-surface shadow-sm transition-all duration-300 hover:-translate-y-0.5 hover:bg-accent hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-accent/50 focus:ring-offset-2 focus:ring-offset-primary"
      >
        Close
      </button>
    </div>
  </div>
</div>
