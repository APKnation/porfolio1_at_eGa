<section id="projects" class="bg-primary text-surface py-24 px-6 sm:px-12 lg:px-20 -mx-5 sm:-mx-8 lg:-mx-10">
  <div class="mb-12 flex flex-col gap-5 border-b border-surface/20 pb-8 sm:flex-row sm:items-end sm:justify-between">
    <div>
      <p class="text-[10px] font-black uppercase tracking-[0.25em] text-accent">02 / Portfolio</p>
      <h2 class="mt-3 text-4xl font-black leading-none tracking-[-0.06em] text-surface sm:text-5xl lg:text-6xl">
        Projects
      </h2>
    </div>
    <p class="max-w-sm text-sm leading-6 text-surface/70">A curated selection of projects that demonstrates my process, range, and attention to detail.</p>
  </div>

  <div
    *ngIf="projects.length; else emptyState"
    class="grid gap-4 md:grid-cols-2 lg:grid-cols-3"
  >
    <article
      *ngFor="let project of projects; let index = index"
      class="group flex min-h-[18rem] flex-col rounded-3xl bg-surface/5 border border-surface/10 p-7 transition duration-300 hover:bg-surface/10 sm:p-9 shadow-lg"
    >
      <p class="text-xs font-black text-accent mb-4">
        0{{ index + 1 }}
      </p>

      <h3 class="text-2xl font-bold leading-tight tracking-[-0.03em] text-surface">
        {{ project.title }}
      </h3>

      <p class="mt-4 text-sm leading-6 text-surface/70">
        {{ project.description }}
      </p>

      <div class="mt-auto pt-8">
        <a
          *ngIf="project.url"
          [href]="project.url"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex w-fit items-center gap-2 text-[11px] font-black uppercase tracking-[0.16em] text-accent hover:text-accent/80 transition-colors"
        >
          View project
        </a>
      </div>
    </article>
  </div>

  <ng-template #emptyState>
    <div class="border border-dashed border-surface/30 rounded-2xl px-6 py-14 text-center text-surface/50 text-sm">
      No projects added yet.
    </div>
  </ng-template>
</section>
