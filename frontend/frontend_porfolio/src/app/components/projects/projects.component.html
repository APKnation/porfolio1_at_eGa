<section class="space-y-8" id="projects">
  <div class="rounded-[2rem] border border-white/10 bg-slate-950/80 p-8 shadow-2xl shadow-slate-950/30 sm:p-10">
    <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <h2 class="text-3xl font-semibold text-white">Projects</h2>
        <p class="mt-3 max-w-2xl text-slate-300">A curated selection of the work that best demonstrates your experience and style.</p>
      </div>
    </div>
  </div>

  <div *ngIf="projects.length; else emptyState" class="grid gap-6 lg:grid-cols-2">
    <div *ngFor="let project of projects" class="rounded-[2rem] border border-white/10 bg-white/5 p-6 shadow-xl shadow-slate-950/10 transition hover:-translate-y-1">
      <div class="space-y-4">
        <div class="flex items-start justify-between gap-4">
          <div>
            <h5 class="text-xl font-semibold text-white">{{ project.title }}</h5>
            <p class="mt-2 text-sm text-slate-400">{{ project.description }}</p>
          </div>
        </div>
        <div class="flex flex-wrap items-center gap-3">
          <a *ngIf="project.url" [href]="project.url" target="_blank" class="rounded-full border border-sky-500 bg-sky-500/10 px-4 py-2 text-sm font-medium text-sky-200 transition hover:bg-sky-500/20">View</a>
        </div>
      </div>
    </div>
  </div>

  <ng-template #emptyState>
    <div class="rounded-[2rem] border border-white/10 bg-slate-950/80 p-6 text-slate-400 shadow-xl shadow-slate-950/10">
      No projects added yet.
    </div>
  </ng-template>
</section>
