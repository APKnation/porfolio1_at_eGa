<header class="bg-zinc-200 px-4 pt-4 sm:px-8 sm:pt-6">
  <div class="mx-auto flex min-h-[74px] max-w-6xl items-center justify-between bg-white px-6 sm:px-10">
    <a href="#top" class="grid h-10 w-10 place-items-center rounded-full border-4 border-cyan-600 text-lg font-black text-cyan-600" aria-label="Home">{{ initials }}</a>

    <button type="button" class="grid h-10 w-10 place-items-center rounded border border-zinc-200 text-zinc-800 md:hidden" (click)="isMenuOpen = !isMenuOpen" [attr.aria-expanded]="isMenuOpen" aria-controls="main-navigation" aria-label="Toggle navigation">
      <span class="text-xl leading-none">{{ isMenuOpen ? '×' : '☰' }}</span>
    </button>

    <nav id="main-navigation" [class.hidden]="!isMenuOpen" class="absolute left-4 right-4 top-[90px] z-50 border border-zinc-200 bg-white px-6 py-6 shadow-lg md:static md:flex md:border-0 md:p-0 md:shadow-none" aria-label="Main navigation">
      <div class="flex flex-col gap-5 text-xs font-medium text-zinc-800 md:flex-row md:items-center md:gap-7">
        <a class="text-cyan-600 transition hover:text-cyan-800" href="#top" (click)="closeMenu()">Home</a>
        <a class="transition hover:text-cyan-700" href="#education" (click)="closeMenu()">About me</a>
        <a class="transition hover:text-cyan-700" href="#projects" (click)="closeMenu()">Projects</a>
        <a *ngIf="profile.email" class="transition hover:text-cyan-700" [href]="'mailto:' + profile.email" (click)="closeMenu()">Contact me</a>
      </div>
    </nav>
  </div>
</header>
