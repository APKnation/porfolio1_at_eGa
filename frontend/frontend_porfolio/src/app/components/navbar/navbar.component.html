<header class="sticky top-0 z-50 border-b border-primary/60 bg-primary/90 px-4 backdrop-blur-xl sm:px-8">
  <div class="mx-auto flex h-[76px] max-w-7xl items-center justify-between">
    <a href="#top" class="group flex items-center gap-3" aria-label="Home">
      <span class="grid h-10 w-10 place-items-center rounded-xl bg-accent text-xs font-black tracking-tighter text-surface transition duration-300 group-hover:-rotate-6 group-hover:bg-accent">
        {{ (profile.full_name || profile.name || 'P') | slice:0:1 | uppercase }}
      </span>
      <span class="hidden text-sm font-black tracking-tight text-surface sm:block">{{ profile.full_name || profile.name || 'Portfolio' }}</span>
    </a>

    <nav class="hidden items-center gap-1 md:flex" aria-label="Main navigation">
      <a class="rounded-xl px-4 py-3 text-sm font-bold text-surface transition hover:bg-primary hover:text-surface" href="#top">Home</a>
      <a class="rounded-xl px-4 py-3 text-sm font-bold text-surface transition hover:bg-primary hover:text-surface" href="#education">About</a>
      <a class="rounded-xl px-4 py-3 text-sm font-bold text-surface transition hover:bg-primary hover:text-surface" href="#projects">Projects</a>
      <a class="rounded-xl px-4 py-3 text-sm font-bold text-surface transition hover:bg-primary hover:text-surface" href="#skills">Skills</a>
      <a *ngIf="profile.email" class="ml-3 rounded-xl bg-accent px-4 py-3 text-sm font-bold text-surface transition hover:bg-accent" [href]="'mailto:' + profile.email">Let's talk</a>
    </nav>

    <details class="relative md:hidden">
      <summary class="grid h-10 w-10 cursor-pointer list-none place-items-center rounded-xl border border-primary text-xl leading-none text-surface transition hover:bg-primary [&::-webkit-details-marker]:hidden" aria-label="Open navigation menu">☰</summary>
      <nav class="absolute right-0 top-[3.25rem] w-64 rounded-2xl border border-primary bg-primary p-3 shadow-2xl shadow-black/40" aria-label="Mobile navigation">
        <div class="flex flex-col gap-1">
          <a class="rounded-xl px-4 py-3 text-sm font-bold text-surface transition hover:bg-primary hover:text-surface" href="#top">Home</a>
          <a class="rounded-xl px-4 py-3 text-sm font-bold text-surface transition hover:bg-primary hover:text-surface" href="#education">About</a>
          <a class="rounded-xl px-4 py-3 text-sm font-bold text-surface transition hover:bg-primary hover:text-surface" href="#projects">Projects</a>
          <a class="rounded-xl px-4 py-3 text-sm font-bold text-surface transition hover:bg-primary hover:text-surface" href="#skills">Skills</a>
          <a *ngIf="profile.email" class="mt-2 rounded-xl bg-accent px-4 py-3 text-center text-sm font-bold text-surface transition hover:bg-accent" [href]="'mailto:' + profile.email">Let's talk</a>
        </div>
      </nav>
    </details>
  </div>
</header>
