<header class="sticky top-0 z-50 border-b border-zinc-800 bg-zinc-950 text-white">
  <div class="mx-auto flex min-h-[72px] max-w-7xl items-center justify-between px-5 sm:px-8 lg:px-10">
    <a href="#top" class="grid h-9 w-9 place-items-center border border-white text-[10px] font-black tracking-tighter transition hover:rotate-6" aria-label="Home">{{ initials }}</a>
    <button type="button" class="grid h-10 w-10 place-items-center border border-zinc-700 text-white md:hidden" (click)="isMenuOpen = !isMenuOpen" [attr.aria-expanded]="isMenuOpen" aria-controls="main-navigation" aria-label="Toggle navigation"><span class="text-xl leading-none">{{ isMenuOpen ? '×' : '☰' }}</span></button>
    <nav id="main-navigation" [class.hidden]="!isMenuOpen" class="absolute left-0 right-0 top-[72px] border-b border-zinc-800 bg-zinc-950 px-5 py-6 md:static md:flex md:items-center md:gap-8 md:border-0 md:p-0" aria-label="Main navigation">
      <div class="flex flex-col gap-5 text-xs font-bold uppercase tracking-[0.16em] md:flex-row md:items-center md:gap-8">
        <a class="transition hover:text-zinc-400" href="#education" (click)="closeMenu()">About me</a>
        <a class="transition hover:text-zinc-400" href="#skills" (click)="closeMenu()">Skills</a>
        <a class="transition hover:text-zinc-400" href="#projects" (click)="closeMenu()">Portfolio</a>
        <a *ngIf="profile.email" class="rounded-full bg-white px-4 py-3 text-center text-[10px] font-black text-zinc-950 transition hover:bg-zinc-300" [href]="'mailto:' + profile.email" (click)="closeMenu()">Contact me</a>
      </div>
    </nav>
  </div>
</header>
