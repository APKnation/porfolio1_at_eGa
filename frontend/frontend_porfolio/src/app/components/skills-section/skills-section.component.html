<section id="skills" class="py-20 lg:py-28">
  <div class="grid gap-10 lg:grid-cols-[32%_1fr]">
    <div>
      <p class="text-[10px] font-black uppercase tracking-[0.25em] text-accent">03 / Toolkit</p>
      <h2 class="mt-5 text-4xl font-black leading-none tracking-[-0.06em] text-surface sm:text-5xl lg:text-6xl">Skills &<br>tools.</h2>
    </div>
    <div *ngIf="skills.length; else emptyState" class="grid content-start grid-cols-2 gap-px border border-surface/10 bg-surface/10 sm:grid-cols-3 rounded-2xl overflow-hidden">
      <div *ngFor="let skill of skills" class="bg-primary p-6 transition duration-300 hover:bg-surface/5 group flex flex-col justify-center">
        <p class="font-bold text-surface">{{ skill.name }}</p>
        <p *ngIf="skill.level" class="mt-2 text-xs font-semibold text-surface/50">{{ skill.level }}</p>
      </div>
    </div>
    <ng-template #emptyState><p class="self-end text-surface/50 text-sm">No skills added yet.</p></ng-template>
  </div>
</section>
