<section id="skills" class="bg-primary px-6 py-20 text-surface sm:px-12 lg:px-24 lg:py-28">
  <div class="mx-auto grid max-w-6xl gap-10 lg:grid-cols-[32%_1fr]">
    <div>
      <p class="text-xs font-black uppercase tracking-[0.2em] text-accent">03 / Toolkit</p>
      <h2 class="mt-5 text-5xl font-bold leading-[.85] tracking-[-0.07em] text-surface sm:text-6xl">Skills &<br>tools.</h2>
    </div>
    <div *ngIf="skills.length; else emptyState" class="grid content-start grid-cols-2 gap-px border border-primary/50 bg-primary/30 sm:grid-cols-3">
      <div *ngFor="let skill of skills" class="bg-primary p-5 transition duration-200 hover:bg-accent hover:text-surface group">
        <p class="font-bold text-surface group-hover:text-surface">{{ skill.name }}</p>
        <p *ngIf="skill.level" class="mt-1 text-xs text-surface group-hover:text-surface">{{ skill.level }}</p>
      </div>
    </div>
    <ng-template #emptyState><p class="self-end text-surface">No skills added yet.</p></ng-template>
  </div>
</section>
