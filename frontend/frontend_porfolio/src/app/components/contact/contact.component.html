<section id="contact" class="py-12">
  <div class="grid gap-12 lg:grid-cols-2 lg:gap-8 items-start">
    
    <!-- LEFT SIDE: Text -->
    <div>
      <p class="text-[10px] font-black uppercase tracking-[0.25em] text-accent">04 / Contact</p>
      <h2 class="mt-5 text-4xl font-black leading-none tracking-[-0.06em] text-surface sm:text-5xl lg:text-6xl">
        Let's work <br>together.
      </h2>
      <p class="mt-6 text-sm leading-relaxed text-surface/70 max-w-md">
        Have a project in mind, a question, or just want to say hi? Fill out the form below and I'll get back to you as soon as possible.
      </p>
    </div>

    <!-- RIGHT SIDE: Form -->
    <div class="bg-surface/5 border border-surface/10 rounded-3xl p-6 sm:p-10 shadow-2xl">
      <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
        
        <!-- Name & Email Row -->
        <div class="grid sm:grid-cols-2 gap-5">
          <div class="flex flex-col gap-1.5">
            <label for="name" class="text-xs font-bold text-surface/80 uppercase tracking-wide">Name</label>
            <input type="text" id="name" formControlName="name" placeholder="enter your name" 
                   class="w-full bg-primary/50 border border-surface/20 rounded-xl px-4 py-3 text-sm text-surface placeholder:text-surface/30 focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-all"
                   [ngClass]="{'border-red-500': contactForm.get('name')?.invalid && contactForm.get('name')?.touched}">
          </div>
          
          <div class="flex flex-col gap-1.5">
            <label for="email" class="text-xs font-bold text-surface/80 uppercase tracking-wide">Email</label>
            <input type="email" id="email" formControlName="email" placeholder="enter valid email"
                   class="w-full bg-primary/50 border border-surface/20 rounded-xl px-4 py-3 text-sm text-surface placeholder:text-surface/30 focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-all"
                   [ngClass]="{'border-red-500': contactForm.get('email')?.invalid && contactForm.get('email')?.touched}">
          </div>
        </div>

        <!-- Subject Row -->
        <div class="flex flex-col gap-1.5">
          <label for="subject" class="text-xs font-bold text-surface/80 uppercase tracking-wide">Subject <span class="text-surface/40 font-normal">(Optional)</span></label>
          <input type="text" id="subject" formControlName="subject" placeholder="What's this about?"
                 class="w-full bg-primary/50 border border-surface/20 rounded-xl px-4 py-3 text-sm text-surface placeholder:text-surface/30 focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-all">
        </div>

        <!-- Message Row -->
        <div class="flex flex-col gap-1.5">
          <label for="message" class="text-xs font-bold text-surface/80 uppercase tracking-wide">Message</label>
          <textarea id="message" formControlName="message" rows="4" placeholder="Your message here..."
                    class="w-full bg-primary/50 border border-surface/20 rounded-xl px-4 py-3 text-sm text-surface placeholder:text-surface/30 focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-all resize-none"
                    [ngClass]="{'border-red-500': contactForm.get('message')?.invalid && contactForm.get('message')?.touched}"></textarea>
        </div>

        <!-- Submit Button & Status -->
        <div class="mt-4 flex items-center justify-between">
          <button type="submit" [disabled]="status === 'submitting'"
                  class="bg-accent text-primary px-8 py-3.5 rounded-full font-bold text-sm sm:text-base transition-all hover:bg-accent/90 disabled:opacity-50 disabled:cursor-not-allowed">
            {{ status === 'submitting' ? 'Sending...' : 'Send Message' }}
          </button>
          
          <div *ngIf="status === 'success'" class="text-accent text-sm font-bold animate-pulse">
            Message sent successfully!
          </div>
          <div *ngIf="status === 'error'" class="text-red-400 text-sm font-bold">
            Failed to send message.
          </div>
        </div>
        
      </form>
    </div>

  </div>
</section>
